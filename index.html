<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga FIFA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f5c518;
    --gold-dim: #d4a800;
    --dark: #0a0e0b;
    --surface: #111612;
    --surface2: #181e19;
    --surface3: #1f2720;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #f0f4f1;
    --text2: #7a9080;
    --text3: #4a6050;
    --win: #f5c518;
    --draw: #ffc107;
    --loss: #f44336;
    --radius: 12px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 8px; }

  nav { display: flex; gap: 4px; }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .tab-btn:hover { background: var(--surface3); color: var(--text); }
  .tab-btn.active { background: var(--gold); color: #1a1200; }
  .tab-btn svg { width: 16px; height: 16px; }
  .tab-btn.admin-tab { display: none; }
  .tab-btn.admin-tab.visible { display: flex; }

  .btn-login {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-login:hover { border-color: var(--gold); color: var(--gold); }
  .btn-login.logged { color: var(--gold); border-color: rgba(245,197,24,0.4); }

  #loginOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  #loginOverlay.open { display: flex; }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 32px;
    width: 340px;
    animation: pop 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .login-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 6px;
    text-align: center;
  }
  .login-sub { font-size: 13px; color: var(--text3); text-align: center; margin-bottom: 24px; }
  .login-field { margin-bottom: 14px; }
  .login-error {
    background: rgba(244,67,54,0.1);
    border: 1px solid rgba(244,67,54,0.3);
    color: var(--loss);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 14px;
    display: none;
    text-align: center;
  }
  .login-error.show { display: block; }
  .login-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn-cancel {
    flex: 1;
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel:hover { background: var(--surface3); }

  main { max-width: 860px; margin: 0 auto; padding: 32px 20px; }
  .section { display: none; }
  .section.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1.5px;
    color: var(--gold);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-grid { display: grid; grid-template-columns: 2fr 2fr 2fr 1fr; gap: 12px; align-items: end; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 5px;
  }
  input, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border 0.15s;
  }
  input:focus, select:focus { border-color: var(--gold); }
  input::placeholder { color: var(--text3); }
  select option { background: var(--surface2); }

  .btn {
    background: var(--gold);
    color: #1a1200;
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { background: var(--gold-dim); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn-ghost {
    background: none;
    color: var(--loss);
    border: 1px solid rgba(244,67,54,0.3);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost:hover { background: rgba(244,67,54,0.1); }
  .btn-full { width: 100%; justify-content: center; }

  .player-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .player-item:last-child { border-bottom: none; }
  .player-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .team-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .team-tag {
    background: var(--surface3);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--text2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .team-tag.t1 { border-color: rgba(245,197,24,0.4); color: var(--gold); }
  .team-crest {
    width: 14px;
    height: 14px;
    object-fit: contain;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .team-input-wrap { position: relative; }
  .team-preview {
    margin-top: 6px;
    min-height: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
    font-size: 12px;
  }
  .team-preview img {
    width: 16px;
    height: 16px;
    object-fit: contain;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .team-fallback {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(245,197,24,0.18);
    border: 1px solid rgba(245,197,24,0.45);
    color: var(--gold);
    font-size: 9px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.2px;
    flex: 0 0 auto;
  }
  .form-actions {
    display: flex;
    align-items: flex-end;
    min-height: 100%;
  }
  .form-actions .btn {
    width: 100%;
    justify-content: center;
    min-height: 38px;
  }
  .row-actions { display: flex; align-items: center; gap: 8px; }

  .score-section {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 20px;
  }
  .score-player { flex: 1; text-align: center; }
  .score-player-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; margin-bottom: 2px; }
  .score-team-name { font-size: 12px; color: var(--text2); margin-bottom: 12px; }
  .score-num {
    width: 72px; height: 72px;
    background: var(--surface3);
    border: 2px solid var(--border2);
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    text-align: center;
    color: var(--text);
    outline: none;
    margin: 0 auto;
    display: block;
    transition: border 0.15s;
  }
  .score-num:focus { border-color: var(--gold); }
  .score-sep { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--text3); padding: 0 16px; }

  .standings-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .standings-table th {
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text3);
    text-align: center; padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  .standings-table th:first-child, .standings-table th:nth-child(2) { text-align: left; }
  .standings-table td {
    padding: 12px 8px; text-align: center;
    border-bottom: 1px solid var(--border); color: var(--text2);
  }
  .standings-table td:first-child, .standings-table td:nth-child(2) { text-align: left; }
  .standings-table td:nth-child(2) { font-weight: 600; color: var(--text); }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table tr:hover td { background: var(--surface2); }
  .pts-cell { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--gold) !important; }
  .rank-cell { color: var(--text3) !important; font-weight: 600; width: 32px; }
  .rank-1 { color: #FFD700 !important; }
  .rank-2 { color: #C0C0C0 !important; }
  .rank-3 { color: #cd7f32 !important; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--gold); line-height: 1; }
  .stat-lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); margin-top: 4px; }

  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    transition: border 0.15s;
  }
  .match-card:hover { border-color: var(--border2); }
  .match-home { text-align: right; }
  .match-away { text-align: left; }
  .match-player { font-weight: 600; font-size: 14px; }
  .match-team { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .match-score-block { text-align: center; }
  .match-score-num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--text); }
  .match-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .match-actions { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .btn-mini {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    border-radius: 16px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-mini:hover { border-color: var(--gold); color: var(--gold); }
  .result-badges { display: flex; gap: 4px; justify-content: center; margin-top: 4px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; }
  .badge-w { background: rgba(245,197,24,0.15); color: var(--win); }
  .badge-d { background: rgba(255,193,7,0.15); color: var(--draw); }
  .badge-l { background: rgba(244,67,54,0.15); color: var(--loss); }

  .empty { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
  .empty svg { margin-bottom: 12px; opacity: 0.3; display: block; margin-left: auto; margin-right: auto; }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--gold);
    color: #1a1200;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: 30px;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    header { padding: 0 12px; gap: 6px; flex-wrap: wrap; height: auto; padding: 10px 12px; }
    .logo { font-size: 22px; }
    .tab-btn span { display: none; }
    .tab-btn { padding: 8px 10px; }
    main { padding: 20px 12px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid > *:last-child { grid-column: 1 / -1; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">âš½ <span>LIGA</span> FIFA</div>
  <div class="header-right">
    <nav>
      <button class="tab-btn active" onclick="showTab('standings', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21V13M12 21V9M16 21V5"/></svg>
        <span>Tabla</span>
      </button>
      <button class="tab-btn" onclick="showTab('history', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Historial</span>
      </button>
      <button class="tab-btn admin-tab" id="tabSetupBtn" onclick="showTab('setup', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Jugadores</span>
      </button>
      <button class="tab-btn admin-tab" id="tabMatchesBtn" onclick="showTab('matches', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 9 0 12M12 3C9 6 9 12 12 15M3 12h18"/></svg>
        <span>Partido</span>
      </button>
    </nav>
    <button class="btn-login" id="loginBtn" onclick="openLogin()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Admin
    </button>
  </div>
</header>

<main>

  <!-- TABLA â€” pÃºblica, pantalla principal -->
  <div id="tab-standings" class="section active">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="standings-table">
        <thead>
          <tr>
            <th>#</th><th>Jugador</th><th>PJ</th><th>G</th><th>E</th>
            <th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- HISTORIAL â€” pÃºblico -->
  <div id="tab-history" class="section">
    <div id="matchHistory"></div>
  </div>

  <!-- JUGADORES â€” solo admin -->
  <div id="tab-setup" class="section">
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Agregar jugador
      </div>
      <div class="form-grid">
        <div>
          <label>Nombre</label>
          <input type="text" id="playerName" placeholder="Ej: MatÃ­as">
        </div>
        <div>
          <label>Equipo 1</label>
          <div class="team-input-wrap">
            <input type="text" id="team1" list="fifaTeamsList" placeholder="Ej: Real Madrid" oninput="setTeamPreview('team1','team1Preview')" onblur="enrichTeamPreview('team1','team1Preview')">
          </div>
        </div>
        <div>
          <label>Equipo 2</label>
          <div class="team-input-wrap">
            <input type="text" id="team2" list="fifaTeamsList" placeholder="Ej: Barcelona" oninput="setTeamPreview('team2','team2Preview')" onblur="enrichTeamPreview('team2','team2Preview')">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="addPlayer()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
            Agregar
          </button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Jugadores registrados
      </div>
      <div id="playerList"><div class="empty">Sin jugadores aÃºn</div></div>
    </div>
  </div>

  <!-- PARTIDO â€” solo admin -->
  <div id="tab-matches" class="section">
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 9 0 12M12 3C9 6 9 12 12 15M3 12h18"/></svg>
        Registrar resultado
      </div>
      <div class="form-grid-2">
        <div>
          <label>Jugador local</label>
          <select id="playerHome" onchange="updateTeams()"></select>
        </div>
        <div>
          <label>Jugador visitante</label>
          <select id="playerAway" onchange="updateTeams()"></select>
        </div>
        <div>
          <label>Equipo local</label>
          <input type="text" id="teamHome" list="fifaTeamsList" oninput="syncMatchTeamLabels(); setTeamPreview('teamHome','teamHomePreview')">
          <div id="teamHomePreview" class="team-preview"></div>
        </div>
        <div>
          <label>Equipo visitante</label>
          <input type="text" id="teamAway" list="fifaTeamsList" oninput="syncMatchTeamLabels(); setTeamPreview('teamAway','teamAwayPreview')">
          <div id="teamAwayPreview" class="team-preview"></div>
        </div>
      </div>
      <div class="score-section">
        <div class="score-player">
          <div class="score-player-name" id="homePlayerLabel">Local</div>
          <div class="score-team-name" id="homeTeamLabel">â€”</div>
          <input type="number" class="score-num" id="scoreHome" min="0" value="0">
        </div>
        <div class="score-sep">:</div>
        <div class="score-player">
          <div class="score-player-name" id="awayPlayerLabel">Visitante</div>
          <div class="score-team-name" id="awayTeamLabel">â€”</div>
          <input type="number" class="score-num" id="scoreAway" min="0" value="0">
        </div>
      </div>
      <button class="btn btn-full" onclick="saveMatch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar partido
      </button>
    </div>
  </div>

</main>

<datalist id="fifaTeamsList"></datalist>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-title">ðŸ” Acceso Admin</div>
    <div class="login-sub">Solo para administradores de la liga</div>
    <div class="login-field">
      <label>Usuario</label>
      <input type="text" id="loginUser" placeholder="usuario" autocomplete="username">
    </div>
    <div class="login-field">
      <label>ContraseÃ±a</label>
      <input type="password" id="loginPass" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-error" id="loginError">Usuario o contraseÃ±a incorrectos</div>
    <div class="login-actions">
      <button class="btn-cancel" onclick="closeLogin()">Cancelar</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="doLogin()">Ingresar</button>
    </div>

function normalizeTeam(team) {
  if (!team) return { name: '', logo: '' };
  if (typeof team === 'string') {
    const found = findTeam(team);
    return { name: team, logo: found ? found.logo : '' };
  }
  return { name: team.name || '', logo: team.logo || '' };
}

function normalizeState() {
  state.players = (state.players || []).map(p => ({
    ...p,
    teams: (p.teams || []).map(normalizeTeam)
  }));
  state.matches = (state.matches || []).map(m => ({
    ...m,
    home: { ...m.home, team: normalizeTeam(m.home ? m.home.team : '') },
    away: { ...m.away, team: normalizeTeam(m.away ? m.away.team : '') }
  }));
  persist();
}

function keyify(value) {
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

function findTeam(name) {
  const key = keyify(name);
  if (!key) return null;
  const aliased = teamAliases[key] ? keyify(teamAliases[key]) : key;
  return teamCatalog.find(t => keyify(t.name) === aliased)
    || teamCatalog.find(t => keyify(t.name).includes(aliased))
    || null;
}

function renderTeamsDatalist() {
  const list = document.getElementById('fifaTeamsList');
  list.innerHTML = teamCatalog.map(t => `<option value="${esc(t.name)}"></option>`).join('');
}

function upsertTeamCatalog(team) {
  if (!team || !team.name) return;
  const existing = findTeam(team.name);
  if (existing) {
    if (!existing.logo && team.logo) existing.logo = team.logo;
    return;
  }
  teamCatalog.push({ name: team.name, logo: team.logo || '' });
  teamCatalog.sort((a, b) => a.name.localeCompare(b.name, 'es'));
  renderTeamsDatalist();
}

async function searchTeamInSportsDb(name) {
  const cleanName = String(name || '').trim();
  if (!cleanName) return null;
  const key = keyify(cleanName);
  if (teamSearchCache[key]) return teamSearchCache[key];

  try {
    const url = `https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${encodeURIComponent(cleanName)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const teams = Array.isArray(data.teams) ? data.teams : [];
    if (!teams.length) return null;
    const exact = teams.find(t => keyify(t.strTeam) === key) || teams[0];
    const resolved = {
      name: exact.strTeam || cleanName,
      logo: exact.strTeamBadge || exact.strBadge || ''
    };
    teamSearchCache[key] = resolved;
    return resolved;
  } catch (e) {
    return null;
  }
}

async function resolveTeam(name) {
  const cleanName = String(name || '').trim();
  if (!cleanName) return { name: '', logo: '' };
  const local = findTeam(cleanName);
  if (local) return { name: local.name, logo: local.logo || '' };
  const remote = await searchTeamInSportsDb(cleanName);
  if (remote) {
    upsertTeamCatalog(remote);
    return remote;
  }
  return { name: cleanName, logo: '' };
}

function teamHtml(team) {
  if (!team || !team.name) return 'â€”';
  const initials = keyify(team.name).slice(0, 3).toUpperCase() || 'CLB';
  const logo = team.logo
    ? `<img class="team-crest" src="${esc(team.logo)}" alt="" onerror="this.style.display='none'; if(this.nextElementSibling){ this.nextElementSibling.style.display='inline-flex'; }"><span class="team-fallback" style="display:none">${initials}</span>`
    : `<span class="team-fallback">${initials}</span>`;
  return `${logo}${esc(team.name)}`;
}

  const payload = {
    id: editingMatchId || Date.now(),
    date: new Date().toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' }),
    home: { playerId: phId, playerName: ph.name, team: homeTeam, score: sh },
    away: { playerId: paId, playerName: pa.name, team: awayTeam, score: sa }
  };

  if (editingMatchId) {
    state.matches = state.matches.map(m => m.id === editingMatchId ? payload : m);
    editingMatchId = null;
    toast('âœ“ Partido actualizado');
  } else {
    state.matches.push(payload);
    toast('âœ“ Partido guardado');
  }
  persist();
  scheduleCloudSync();
  document.getElementById('scoreHome').value = 0;
  document.getElementById('scoreAway').value = 0;
  renderHistory();
  renderStandings();
}

function editMatch(id) {
  const match = state.matches.find(m => m.id === id);
  if (!match) return;
  showTab('matches', document.getElementById('tabMatchesBtn'));
  document.getElementById('playerHome').value = match.home.playerId;
  document.getElementById('playerAway').value = match.away.playerId;
  updateTeams();
  document.getElementById('teamHome').value = normalizeTeam(match.home.team).name;
  document.getElementById('teamAway').value = normalizeTeam(match.away.team).name;
  setTeamPreview('teamHome', 'teamHomePreview');
  setTeamPreview('teamAway', 'teamAwayPreview');
  syncMatchTeamLabels();
  document.getElementById('scoreHome').value = match.home.score;
  document.getElementById('scoreAway').value = match.away.score;
  editingMatchId = id;
  toast('Editando partido seleccionado');
}

function deleteMatch(id) {
  if (!confirm('Â¿Eliminar este partido?')) return;
  state.matches = state.matches.filter(m => m.id !== id);
  persist();
  scheduleCloudSync();
  renderHistory();
  renderStandings();
  toast('Partido eliminado');
}

// â”€â”€â”€ STANDINGS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function buildStats() {
  const stats = {};
  state.players.forEach(p => { stats[p.id] = { id: p.id, name: p.name, pj:0, g:0, e:0, l:0, gf:0, gc:0 }; });
  state.matches.forEach(m => {
    const h = stats[m.home.playerId], a = stats[m.away.playerId];
    if (!h || !a) return;
    const sh = m.home.score, sa = m.away.score;
    h.pj++; a.pj++; h.gf += sh; h.gc += sa; a.gf += sa; a.gc += sh;
    if (sh > sa) { h.g++; a.l++; } else if (sh < sa) { a.g++; h.l++; } else { h.e++; a.e++; }
  });
  return Object.values(stats).map(s => ({ ...s, pts: s.g*3+s.e, dg: s.gf-s.gc }))
    .sort((a, b) => b.pts-a.pts || b.dg-a.dg || b.gf-a.gf);
}

function renderStandings() {
  const rows = buildStats();
  const totalGoals = state.matches.reduce((s, m) => s + m.home.score + m.away.score, 0);
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${state.players.length}</div><div class="stat-lbl">Jugadores</div></div>
    <div class="stat-card"><div class="stat-num">${state.matches.length}</div><div class="stat-lbl">Partidos</div></div>
    <div class="stat-card"><div class="stat-num">${totalGoals}</div><div class="stat-lbl">Goles</div></div>
    <div class="stat-card"><div class="stat-num">${rows.length ? rows[0].pts : 0}</div><div class="stat-lbl">LÃ­der pts</div></div>
  `;
  if (!rows.length) { document.getElementById('standingsBody').innerHTML = '<tr><td colspan="10" class="empty">AÃºn sin datos</td></tr>'; return; }
  const rc = i => ['rank-1','rank-2','rank-3'][i] || '';
  const rl = i => ['ðŸ¥‡','ðŸ¥ˆ','ðŸ¥‰'][i] || (i+1);
  document.getElementById('standingsBody').innerHTML = rows.map((r, i) => `
    <tr>
      <td class="rank-cell ${rc(i)}">${rl(i)}</td>
      <td>${esc(r.name)}</td>
      <td>${r.pj}</td>
      <td style="color:var(--win)">${r.g}</td>
      <td style="color:var(--draw)">${r.e}</td>
      <td style="color:var(--loss)">${r.l}</td>
      <td>${r.gf}</td><td>${r.gc}</td>
      <td style="color:${r.dg>=0?'var(--win)':'var(--loss)'}">${r.dg>0?'+':''}${r.dg}</td>
      <td class="pts-cell">${r.pts}</td>
    </tr>
  `).join('');
}

// â”€â”€â”€ HISTORY â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderHistory() {
  const el = document.getElementById('matchHistory');
  if (!state.matches.length) {
    el.innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 3c3 3 3 9 0 12M12 3C9 6 9 12 12 15M3 12h18"/></svg><div>No hay partidos jugados aÃºn</div></div>`;
    return;
  }
  el.innerHTML = [...state.matches].reverse().map(m => {
    const sh = m.home.score, sa = m.away.score;
    const hR = sh>sa?'badge-w':sh<sa?'badge-l':'badge-d';
    const aR = sa>sh?'badge-w':sa<sh?'badge-l':'badge-d';
    return `
      <div class="match-card">
        <div class="match-home">
          <div class="match-player">${esc(m.home.playerName)}</div>
          <div class="match-team">${teamHtml(normalizeTeam(m.home.team))}</div>
        </div>
        <div class="match-score-block">
          <div class="match-score-num">${sh} â€“ ${sa}</div>
          <div class="result-badges">
            <span class="badge ${hR}">${sh>sa?'G':sh<sa?'P':'E'}</span>
            <span class="badge ${aR}">${sa>sh?'G':sa<sh?'P':'E'}</span>
          </div>
          <div class="match-date">${m.date}</div>
          ${isAdmin ? `<div class="match-actions"><button class="btn-mini" onclick="editMatch(${m.id})">Editar</button><button class="btn-mini" onclick="deleteMatch(${m.id})">Borrar</button></div>` : ''}
        </div>
        <div class="match-away">
          <div class="match-player">${esc(m.away.playerName)}</div>
          <div class="match-team">${teamHtml(normalizeTeam(m.away.team))}</div>
        </div>
      </div>`;
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function initApp() {
  await loadTeamCatalog();
  normalizeState();
  await loadStateFromCloud();
  normalizeState();
  renderPlayerList();
  renderMatchForm();
  renderStandings();
  renderHistory();
}

initApp();
</script>
